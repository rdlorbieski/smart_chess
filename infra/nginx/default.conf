server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # PGN imports (TWIC, Lichess Elite) can be large; the API accepts up to 200 MB.
  client_max_body_size 200m;

  # API → container smart-chess-api. Resolving at request time (Docker DNS)
  # keeps nginx working when the API container is recreated with a new IP.
  resolver 127.0.0.11 valid=30s;
  location /api/ {
    set $api http://smart-chess-api:3001;
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Caddy terminates TLS; the API marks the session cookie Secure when this is https.
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    # Batch analysis and big imports can take a while.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location / {
    # index.html points at hashed bundles, so it must always revalidate.
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }

  # Hashed bundles and static assets (incl. the Stockfish WASM fallback)
  location ~* \.(js|css|wasm|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
  }
}
